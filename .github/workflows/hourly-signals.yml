name: Hourly AR/DR Signals

on:
  schedule:
    # Every 30 min at :10 / :40 UTC (:10 after 1H close; ~7–15 min scan fits the gap)
    - cron: "10,40 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hourly-signals.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hourly-signals
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan NDX100 + SP500 + DJI30 + Futures + FX + Top30 Crypto
        if: github.event_name != 'push'
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: utf-8
        run: python -u scan_signals.py

      - name: Commit signal report
        if: github.event_name != 'push'
        run: |
          git add signals/latest.json signals/latest.html signals/index.html
          if git diff --staged --quiet; then
            echo "No signal file changes"
            exit 0
          fi
          git commit -m "chore: update hourly touch alerts HTML"
          if ! git pull --rebase origin main; then
            git checkout --theirs signals/latest.json signals/latest.html signals/index.html
            git add signals/latest.json signals/latest.html signals/index.html
            GIT_EDITOR=true git rebase --continue
          fi
          git push origin main
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Prepare Pages site
        run: |
          mkdir -p _site
          cp signals/latest.html _site/index.html
          cp signals/latest.json _site/latest.json
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
