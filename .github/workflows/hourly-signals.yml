name: Hourly AR/DR Signals

on:
  schedule:
    # Every hour at :10 UTC (after many 1H candles close; also rescans 1D)
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hourly-signals
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan NDX100 + Futures + Top50 Crypto
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: utf-8
        run: python -u scan_signals.py

      - name: Commit signal report
        run: |
          git add signals/latest.json signals/latest.html signals/index.html
          if git diff --staged --quiet; then
            echo "No signal file changes"
            exit 0
          fi
          git commit -m "chore: update hourly touch alerts HTML"
          git push
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

      # GITHUB_TOKEN pushes do not trigger other workflows — deploy Pages here.
      - name: Prepare Pages site
        run: |
          mkdir -p _site
          cp signals/latest.html _site/index.html
          cp signals/latest.json _site/latest.json
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
