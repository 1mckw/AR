name: Deploy Signals HTML

on:
  push:
    branches: [main, master]
    paths:
      - "signals/**"
      - ".github/workflows/deploy-signals-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: signals-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir -p _site
          cp signals/latest.html _site/index.html 2>/dev/null || printf '%s\n' '<!doctype html><title>Signals</title><p>Waiting for first hourly scan.</p>' > _site/index.html
          cp signals/latest.json _site/latest.json 2>/dev/null || true
          cp signals/history.json _site/history.json 2>/dev/null || true
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
