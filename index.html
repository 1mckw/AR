<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR/DR · Trend Lines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --bg: #000000; --bg-deep: #020408;
      --panel: rgba(8, 12, 20, 0.58); --panel-2: rgba(12, 18, 28, 0.68); --surface: rgba(16, 24, 36, 0.75);
      --glass-blur: blur(24px) saturate(1.45);
      --border: rgba(0, 255, 213, 0.18); --border-strong: rgba(0, 255, 213, 0.34);
      --text: #eefdfb; --muted: #7a93a8;
      --primary: #00f0c8; --primary-dim: #00b894; --accent: #38bdf8; --neon-pink: #ff2d6a;
      --profit: #00e896; --loss: #ff4d6d; --lime: #5dffb1;
      --resist: #ff4d6d; --support: #00e896; --ring: #00f0c8;
      --top-h: 44px; --bottom-h: 44px; --rail-w: 300px;
      --radius: 10px; --ease: 200ms cubic-bezier(.2,.8,.2,1);
      --glow: 0 0 28px rgba(0, 240, 200, 0.28);
      --glass-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 10px 40px rgba(0,0,0,0.55), 0 0 30px rgba(0,240,200,0.07);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Space Grotesk", system-ui, sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(900px 520px at 8% -15%, rgba(0, 240, 200, 0.14), transparent 58%),
        radial-gradient(700px 480px at 92% 108%, rgba(255, 45, 106, 0.11), transparent 55%),
        radial-gradient(600px 400px at 55% 42%, rgba(56, 189, 248, 0.06), transparent 60%),
        linear-gradient(180deg, #030508 0%, #000000 100%);
      color: var(--text);
      display: grid;
      grid-template-rows: var(--top-h) 1fr var(--bottom-h);
      grid-template-columns: 1fr var(--rail-w);
      grid-template-areas:
        "top top"
        "chart rail"
        "bottom bottom";
      overflow: hidden;
      font-size: 13px; line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.42;
      background-image:
        linear-gradient(rgba(0, 255, 213, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 213, 0.045) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at center, black 15%, transparent 78%);
    }
    .topbar, .rail, .bottombar, .chart-pane, .symbol-fab, .symbol-overlay {
      position: relative; z-index: 1;
    }
    :focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    .topbar {
      grid-area: top; z-index: 2;
      display: flex; align-items: center; gap: 12px;
      padding: 0 14px; border-bottom: 1px solid var(--border-strong);
      background: rgba(6, 10, 16, 0.52);
      backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      box-shadow: var(--glass-shadow);
    }
    .brand { flex-shrink: 0; white-space: nowrap; }
    .brand h1 {
      font-size: 0.88rem; font-weight: 700; letter-spacing: -0.03em;
      background: linear-gradient(90deg, #e8f7f4, var(--primary));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .brand a {
      color: var(--primary); text-decoration: none; font-size: 0.62rem;
      margin-left: 8px; font-weight: 600; letter-spacing: .04em;
      border: 1px solid var(--border-strong); border-radius: 999px; padding: 2px 7px;
      background: rgba(0, 240, 200, 0.08);
    }
    .brand a:hover { background: rgba(0, 240, 200, 0.16); }
    .top-controls {
      display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; overflow-x: auto;
    }
    .field {
      display: flex; align-items: center; gap: 5px; flex-shrink: 0;
      font-size: 0.62rem; color: var(--muted); font-weight: 600; letter-spacing: .02em;
    }
    input, select, button {
      font-family: inherit; background: rgba(4, 8, 14, 0.55);
      border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 2px 8px; font-size: 0.72rem; height: 28px;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      transition: border-color var(--ease), color var(--ease), background var(--ease), box-shadow var(--ease);
    }
    input:hover, select:hover { border-color: var(--border-strong); }
    button { cursor: pointer; background: rgba(28, 40, 58, 0.95); font-weight: 600; white-space: nowrap; }
    button:hover { border-color: var(--primary); color: var(--primary); box-shadow: var(--glow); }
    button:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
    button.primary {
      background: linear-gradient(135deg, #00f0c8, #00b894);
      border-color: transparent; color: #04110e;
      box-shadow: 0 4px 16px rgba(0, 240, 200, 0.25);
    }
    button.primary:hover { color: #04110e; filter: brightness(1.06); box-shadow: 0 6px 20px rgba(0, 240, 200, 0.35); }
    #timeframe { width: 52px; } #historyBars { width: 58px; } #pollInterval { width: 52px; }

    .symbol-fab {
      position: fixed; left: 16px; bottom: calc(var(--bottom-h) + 16px); z-index: 60;
      display: flex; flex-direction: row; align-items: center; gap: 10px;
      min-width: 160px; max-width: min(320px, calc(100vw - 40px));
      height: auto; padding: 10px 14px 10px 10px;
      border-radius: 14px; border: 1px solid var(--border-strong);
      background: rgba(6, 10, 18, 0.58);
      backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      box-shadow: var(--glass-shadow), var(--glow);
      color: var(--text); cursor: pointer; text-align: left;
      animation: fabIn .35s var(--ease) both;
    }
    .symbol-fab:hover {
      border-color: var(--primary); transform: translateY(-1px);
      box-shadow: 0 16px 36px rgba(0,0,0,.55), 0 0 28px rgba(0, 240, 200, 0.28);
    }
    .fab-logo {
      width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
      background: rgba(0, 240, 200, 0.08); object-fit: contain; padding: 4px;
      border: 1px solid var(--border);
    }
    .fab-logo[hidden] { display: none !important; }
    .fab-meta { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; }
    .symbol-fab .fab-label {
      font-size: 0.58rem; font-weight: 700; color: var(--primary);
      text-transform: uppercase; letter-spacing: .12em;
    }
    .symbol-fab .fab-sym {
      font-family: "JetBrains Mono", monospace; font-size: 0.92rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
      color: #f0fffb;
    }
    @keyframes fabIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .symbol-overlay {
      position: fixed; inset: 0; z-index: 80;
      background: rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
      display: flex; align-items: flex-start; justify-content: center;
      padding: 11vh 16px 16px;
      animation: fadeIn .2s ease;
    }
    .symbol-overlay[hidden] { display: none !important; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .symbol-modal {
      width: min(500px, 100%);
      background: rgba(8, 12, 20, 0.62);
      backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-strong); border-radius: 16px;
      box-shadow: var(--glass-shadow), 0 0 48px rgba(0, 240, 200, 0.12), 0 0 80px rgba(255, 45, 106, 0.06);
      display: flex; flex-direction: column; max-height: min(70vh, 560px);
      overflow: hidden; animation: modalUp .25s var(--ease);
    }
    @keyframes modalUp {
      from { opacity: 0; transform: translateY(12px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .symbol-modal-head {
      display: flex; align-items: center; gap: 8px;
      padding: 14px; border-bottom: 1px solid var(--border);
      background: rgba(0, 240, 200, 0.04); flex-shrink: 0;
    }
    #symbolSearch {
      flex: 1; width: auto; height: 42px; padding: 8px 14px;
      font-family: "JetBrains Mono", monospace; font-size: 0.95rem; font-weight: 500;
      border-color: var(--border-strong); border-radius: 10px;
      background: rgba(6, 12, 20, 0.9);
    }
    #symbolSearch:focus {
      border-color: var(--primary); outline: none;
      box-shadow: 0 0 0 3px rgba(0, 240, 200, 0.18), var(--glow);
    }
    #symbolSearchClose {
      height: 42px; padding: 0 14px; flex-shrink: 0; border-radius: 10px;
    }
    .symbol-list {
      list-style: none; margin: 0; padding: 8px;
      overflow-y: auto; flex: 1; min-height: 0;
      background: transparent; border: 0; border-radius: 0; box-shadow: none;
      position: static; max-height: none;
    }
    .symbol-list li {
      padding: 9px 10px; border-radius: 10px; cursor: pointer;
      font-size: 0.8rem; color: var(--text);
      display: grid; grid-template-columns: 32px 1fr auto; gap: 2px 10px; align-items: center;
      transition: background var(--ease), transform var(--ease);
    }
    .symbol-list li:hover, .symbol-list li.active {
      background: rgba(0, 240, 200, 0.08);
      box-shadow: inset 2px 0 0 var(--primary);
    }
    .symbol-list li .sym-logo {
      width: 28px; height: 28px; border-radius: 8px; object-fit: contain;
      background: rgba(255,255,255,0.04); padding: 3px; grid-row: span 2; align-self: center;
      border: 1px solid var(--border); display: block;
    }
    .symbol-list li .sym-logo.missing {
      background: rgba(0, 240, 200, 0.06);
    }
    .symbol-list li .sym {
      font-family: "JetBrains Mono", monospace; font-weight: 600; color: var(--primary);
    }
    .symbol-list li .ex {
      font-size: 0.65rem; color: var(--muted); text-align: right; letter-spacing: .02em;
    }
    .symbol-list li .desc {
      grid-column: 2 / -1; font-size: 0.68rem; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    @media (max-width: 900px) {
      .symbol-fab { bottom: calc(var(--bottom-h) + 12px); left: 12px; }
    }

    .chart-pane {
      grid-area: chart; min-width: 0; min-height: 0;
      position: relative; background: transparent;
    }
    #chart { position: absolute; inset: 0; }

    .rail {
      grid-area: rail; min-height: 0; z-index: 2;
      border-left: 1px solid var(--border-strong);
      background: rgba(4, 8, 14, 0.52);
      backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      box-shadow: var(--glass-shadow);
      display: flex; flex-direction: column;
      position: relative;
    }
    .rail-resizer {
      position: absolute; top: 0; left: -4px; bottom: 0; width: 8px;
      cursor: col-resize; z-index: 5;
      background: transparent;
      touch-action: none;
    }
    .rail-resizer::after {
      content: ""; position: absolute; top: 50%; left: 50%;
      width: 2px; height: 40px; border-radius: 2px;
      transform: translate(-50%, -50%);
      background: rgba(0, 240, 200, 0.22);
      transition: background var(--ease), height var(--ease), box-shadow var(--ease);
    }
    .rail-resizer:hover::after,
    body.rail-resizing .rail-resizer::after {
      background: var(--primary);
      height: 56px;
      box-shadow: 0 0 12px rgba(0, 240, 200, 0.45);
    }
    body.rail-resizing {
      cursor: col-resize;
      user-select: none;
    }
    body.rail-resizing .chart-pane,
    body.rail-resizing .rail {
      pointer-events: none;
    }
    body.rail-resizing .rail-resizer {
      pointer-events: auto;
    }
    .rail-nav {
      list-style: none; flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      padding: 8px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .rail-nav button {
      width: 100%; height: auto; min-height: 40px;
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 10px;
      border: 1px solid transparent;
      background: transparent; color: var(--muted);
      font: inherit; font-size: 0.78rem; font-weight: 600;
      text-align: left; cursor: pointer;
      transition: background var(--ease), border-color var(--ease), color var(--ease);
    }
    .rail-nav button:hover {
      color: var(--text);
      background: rgba(0, 240, 200, 0.05);
      border-color: rgba(0, 240, 200, 0.12);
      box-shadow: none;
    }
    .rail-nav button.active {
      color: var(--primary);
      background: rgba(0, 240, 200, 0.08);
      border-color: rgba(0, 240, 200, 0.22);
      box-shadow: inset 3px 0 0 var(--primary);
    }
    .rail-nav .nav-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
      background: var(--primary); box-shadow: 0 0 8px rgba(0, 240, 200, 0.45);
    }
    .rail-nav button[data-panel="touches"] .nav-dot {
      background: var(--accent); box-shadow: 0 0 8px rgba(56, 189, 248, 0.45);
    }
    .rail-nav button[data-panel="history"] .nav-dot {
      background: var(--neon-pink); box-shadow: 0 0 8px rgba(255, 45, 106, 0.4);
    }
    .rail-nav .nav-label { flex: 1; letter-spacing: .03em; }
    .rail-nav .nav-count {
      font-family: "JetBrains Mono", monospace; font-size: 0.68rem;
      color: var(--muted); min-width: 1.4em; text-align: right;
    }
    .rail-nav button.active .nav-count { color: var(--primary); }
    .rail-stats {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      padding: 10px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .stat {
      background: rgba(6, 10, 18, 0.55); border: 1px solid var(--border);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 0 18px rgba(0,240,200,0.05);
      border-radius: 12px; padding: 10px;
      position: relative; overflow: hidden;
    }
    .stat::after {
      content: ""; position: absolute; inset: auto -20% -40% auto; width: 80px; height: 80px;
      border-radius: 50%; pointer-events: none; opacity: 0.35;
    }
    .stat:first-child::after { background: var(--profit); }
    .stat:last-child::after { background: var(--loss); }
    .stat .val {
      font-family: "JetBrains Mono", monospace; font-size: 1.35rem; font-weight: 700;
      font-variant-numeric: tabular-nums; line-height: 1; position: relative;
    }
    .stat .val.ar { color: var(--profit); text-shadow: 0 0 18px rgba(0, 232, 150, 0.35); }
    .stat .val.dr { color: var(--loss); text-shadow: 0 0 18px rgba(255, 77, 109, 0.3); }
    .stat .lbl {
      font-size: 0.6rem; color: var(--muted); margin-top: 6px;
      text-transform: uppercase; letter-spacing: .08em; font-weight: 600; position: relative;
    }

    .rail-body { flex: 1; min-height: 0; overflow-y: auto; padding: 10px; }
    .rail-panel { display: none; flex-direction: column; gap: 6px; }
    .rail-panel.active { display: flex; }

    .signal-list, .break-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .empty-hint {
      font-size: 0.72rem; color: var(--muted); padding: 16px 10px; text-align: center;
      border: 1px dashed var(--border); border-radius: var(--radius);
      background: rgba(0, 240, 200, 0.02);
    }
    .signal-item {
      border: 1px solid var(--border); border-radius: 10px;
      padding: 9px 10px; font-size: 0.72rem; line-height: 1.45;
      background: rgba(6, 10, 18, 0.48);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
      transition: border-color var(--ease), transform var(--ease), box-shadow var(--ease);
    }
    .signal-item:hover {
      border-color: var(--border-strong); transform: translateX(1px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 0 20px rgba(0,240,200,0.1);
    }
    .signal-item.ar { border-left: 3px solid var(--profit); }
    .signal-item.dr { border-left: 3px solid var(--loss); }
    .tag {
      display: inline-block; font-weight: 700; font-size: 0.62rem; padding: 2px 6px;
      border-radius: 5px; margin-right: 4px; font-family: "JetBrains Mono", monospace;
    }
    .tag.ar { background: rgba(0, 232, 150, .14); color: var(--profit); }
    .tag.dr { background: rgba(255, 77, 109, .14); color: var(--loss); }
    .ctx { font-size: 0.65rem; color: var(--muted); margin-top: 3px; }
    .ctx.strong { color: var(--profit); }
    .ctx.weak { color: #fbbf24; }
    .break-item {
      font-size: 0.7rem; padding: 8px 10px; border-radius: 8px;
      background: rgba(6, 10, 18, 0.48); border: 1px solid var(--border);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .break-item.ar { border-left: 3px solid var(--profit); }
    .break-item.dr { border-left: 3px solid var(--loss); }
    .break-item.resistance { border-left: 3px solid var(--resist); }
    .break-item.support { border-left: 3px solid var(--support); }
    .break-item.new { animation: breakFlash 1.1s ease; }
    @keyframes breakFlash {
      0%, 100% { background: rgba(6, 10, 18, 0.48); }
      35% { background: rgba(0, 240, 200, 0.12); }
    }
    .history-meta {
      font-size: 0.62rem; color: var(--muted); padding: 0 2px 8px;
      border-bottom: 1px dashed var(--border); margin-bottom: 8px; line-height: 1.45;
    }
    .history-meta strong { color: var(--primary); font-weight: 600; }
    .history-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .history-item {
      font-size: 0.68rem; padding: 8px 10px; border-radius: 8px; cursor: pointer;
      background: rgba(6, 10, 18, 0.48); border: 1px solid var(--border);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      transition: border-color var(--ease), transform var(--ease);
    }
    .history-item:hover {
      border-color: var(--border-strong); transform: translateX(1px);
    }
    .history-item.ar { border-left: 3px solid var(--profit); }
    .history-item.dr { border-left: 3px solid var(--loss); }
    .history-item.resistance { border-left: 3px solid var(--resist); }
    .history-item.support { border-left: 3px solid var(--support); }
    .history-item .hi-head {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 3px;
    }
    .history-item .hi-tag {
      font-family: "JetBrains Mono", monospace; font-size: 0.58rem; font-weight: 700;
      padding: 1px 5px; border-radius: 4px; background: rgba(0,240,200,.1); color: var(--primary);
    }
    .history-item .hi-src {
      font-size: 0.58rem; color: var(--muted); margin-left: auto;
    }
    .history-item .hi-body { color: var(--text); line-height: 1.4; }
    .history-item .hi-time { font-size: 0.62rem; color: var(--muted); margin-top: 3px; }
    .status-bar {
      flex-shrink: 0; padding: 8px 10px; border-top: 1px solid var(--border);
      background: rgba(4, 8, 14, 0.55); backdrop-filter: blur(12px);
      font-size: 0.64rem; color: var(--muted); line-height: 1.4;
      font-family: "JetBrains Mono", monospace;
    }

    .bottombar {
      grid-area: bottom; z-index: 2;
      display: flex; align-items: center; gap: 10px;
      padding: 0 12px; border-top: 1px solid var(--border-strong);
      background: rgba(4, 8, 14, 0.52);
      backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      box-shadow: var(--glass-shadow);
      overflow-x: auto;
    }
    .param-group {
      display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    }
    .param-group .g-label {
      font-size: 0.58rem; font-weight: 700; color: var(--primary);
      text-transform: uppercase; letter-spacing: .1em; margin-right: 2px;
    }
    .param-group .field input,
    .param-group .field select {
      height: 26px; font-size: 0.7rem;
      font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums;
      border-radius: 7px;
    }
    .sep { width: 1px; height: 22px; background: var(--border-strong); flex-shrink: 0; }

    @media (max-width: 900px) {
      body {
        grid-template-rows: var(--top-h) 1fr var(--bottom-h);
        grid-template-columns: 1fr minmax(220px, var(--rail-w));
        grid-template-areas:
          "top top"
          "chart rail"
          "bottom bottom";
        overflow: hidden;
      }
      .rail {
        border-left: 1px solid var(--border-strong);
        border-top: none;
      }
      .symbol-fab { bottom: calc(var(--bottom-h) + 12px); left: 12px; }
      .rail-nav button { min-height: 36px; padding: 6px 8px; font-size: 0.72rem; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>AR/DR · Trend Lines <a href="https://www.tradingview.com/script/UpsMdRXG-Simple-Auto-Trend-Lines/" target="_blank" rel="noopener">TV</a></h1>
    </div>
    <div class="top-controls" role="group" aria-label="商品與週期">
      <label class="field" for="timeframe">週期
        <select id="timeframe">
          <option value="1h" selected>1H</option>

  <script>
    const LOOKBACK = 10, VOL_LEN = 20, MAX_LINES_PER_PIVOT = 1;
    const MIN_LINE_PIVOTS = 3;
    const PIVOT_LINE_TOL_PCT = 0.002;
    const NEAR_LINE_TOL_PCT = 0.004;
    const LOCAL_EXTREME_WING = 2;
    const MIN_TOUCH_BAR_GAP = 3;
    const SHARP_PIERCE_GRACE_BARS = 2;
    const TREND_EXCEED_BARS = 4;
    const TOUCH_WINDOW_BARS = 12; // 主引線觸碰在此窗口內不報告

    const TIMEFRAMES = {
      '1h': { label: '1H', binance: '1h', yahoo: '1h', periodSec: 3600 },
      '4h': { label: '4H', binance: '4h', yahoo: '4h', periodSec: 14400 },
      '1d': { label: '1D', binance: '1d', yahoo: '1d', periodSec: 86400 },
    };

    const LS_SYMBOL = 'tv_ar_symbol_v2';
    const LS_HISTORY = 'tv_ar_history_v1';
    const LS_RAIL_W = 'tv_ar_rail_w_v1';
    const RAIL_W_MIN = 220;
    const RAIL_W_MAX = 560;
    const RAIL_W_DEFAULT = 300;
    const MAX_LOCAL_HISTORY = 120;
    const MAX_HISTORY_DISPLAY = 60;
    const LOGO_BASE = 'https://s3-symbol-logo.tradingview.com/';
    const IS_PAGES = /\.github\.io$/i.test(location.hostname);
    const REPORT_JSON = IS_PAGES ? 'https://1mckw.github.io/AR/latest.json' : '/signals/latest.json';
    const API_BASE = ''; // same-origin proxy (python server.py); unavailable on GitHub Pages
    const DEFAULT_SYMBOL_RAW = {
      symbol: 'BTCUSDT',
      exchange: 'Binance',
      type: 'spot',
      description: 'Bitcoin / TetherUS',
      typespecs: ['crypto', 'spot'],
      logoid: 'crypto/XTVCBTC',
      logoUrl: 'https://s3-symbol-logo.tradingview.com/crypto/XTVCBTC.svg',
    };

    let chart, candleSeries, volSeries, overlayLines = [];
    let currentCandles = [], activeTrendLines = [];
    let pollTimer = null;
    let watchBaseline = false;
    let untouchedRayKeys = new Set(); // AR/DR 主引線尚未觸碰
    let activeExtRayKeys = new Set(); // 已延伸且仍有效的 AR/DR
    let untouchedTrendKeys = new Set(); // 趨勢線尚未觸碰
    let notExceedingTrendKeys = new Set(); // 最新 N 根尚未全部超出趨勢線
    let breakHistory = [];
    let scanReport = null;
    let historyFetchToken = 0;
    let currentSymbol = null;
    let searchResults = [];
    let symbolHi = -1;
    let searchTimer = null;
    let searchSeq = 0;

    function bearBar(c, i) { return c[i].close < c[i].open; }
    function bullBar(c, i) { return c[i].close > c[i].open; }

    function streak(c, i, bear, len) {
      for (let j = 1; j <= len; j++) {
        const idx = i - j;
        if (idx < 0) return false;
        if (bear ? !bearBar(c, idx) : !bullBar(c, idx)) return false;
      }
      return true;
    }

    function sma(arr, i, len) {
      if (i < len - 1) return null;
      let s = 0;
      for (let j = 0; j < len; j++) s += arr[i - j];
      return s / len;
    }

    function resolveLogoid(raw) {
      return String(
        raw.logoid ||
        raw.logoUrl?.replace(LOGO_BASE, '').replace(/\.svg$/i, '') ||
        (raw.logo && raw.logo.logoid) ||
        raw['base-currency-logoid'] ||
        ''
      ).trim();
    }

    function logoUrlFromId(logoid) {
      if (!logoid) return '';
      return `${LOGO_BASE}${logoid}.svg`;
    }

    function logoImg(url, cls) {
      if (!url) return `<span class="${cls} missing" aria-hidden="true"></span>`;
      return `<img class="${cls}" src="${url}" alt="" width="28" height="28" loading="lazy" decoding="async" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'${cls} missing',ariaHidden:'true'}))" />`;
    }

    function resolveDataSource(raw) {
      const symbol = String(raw.symbol || '').trim();
      const exchange = String(raw.exchange || '').trim();
      const type = String(raw.type || '').toLowerCase();
      const typespecs = (raw.typespecs || []).map(t => String(t).toLowerCase());
      const description = String(raw.description || '');
      const logoid = resolveLogoid(raw);
      const logoUrl = raw.logoUrl || logoUrlFromId(logoid);
      const tvKey = exchange ? `${exchange}:${symbol}` : symbol;
      const exU = exchange.toUpperCase();

      const isFutures = type === 'futures' || type === 'futurescontract';
      const isCrypto =
        !isFutures &&
        (type === 'spot' ||
          type === 'crypto' ||
          (typespecs.includes('spot') && !['stock', 'fund', 'dr', 'index', 'bond'].includes(type)));

      if (isCrypto && !isFutures) {
        const fetchSymbol = symbol.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
        return {
          tvKey, exchange, symbol, type, description, logoid, logoUrl,
          group: exchange || 'Crypto', groupId: 'crypto',
          source: 'crypto', value: fetchSymbol, fetchSymbol,
        };
      }

      if (isFutures) {
        const root = symbol.replace(/[0-9]+!?$/i, '').replace(/!$/g, '') || symbol;
        const fetchSymbol = `${root.toUpperCase()}=F`;
        return {
          tvKey, exchange, symbol, type, description, logoid, logoUrl,
          group: exchange || 'Futures', groupId: 'futures',
          source: 'yahoo', value: fetchSymbol, fetchSymbol,
        };
      }

      let fetchSymbol = symbol;
      if (exU === 'TWSE' && !fetchSymbol.includes('.')) fetchSymbol += '.TW';
      else if (exU === 'TPEX' && !fetchSymbol.includes('.')) fetchSymbol += '.TWO';
      else if (exU === 'HKEX' && !fetchSymbol.includes('.')) fetchSymbol += '.HK';
      else if (['LSE', 'LSEN'].includes(exU) && !fetchSymbol.includes('.')) fetchSymbol += '.L';

      return {
        tvKey, exchange, symbol, type, description, logoid, logoUrl,
        group: exchange || 'Stock', groupId: type || 'stock',
        source: 'yahoo', value: fetchSymbol, fetchSymbol,
      };
    }

    function displaySymbol(info) {
      return info.exchange ? `${info.exchange}:${info.symbol}` : info.symbol;
    }

    function applySymbolToInputs(info) {
      document.getElementById('symbol').value = info.fetchSymbol;
      document.getElementById('symbolSearch').value = displaySymbol(info);
      const fab = document.getElementById('symbolFabText');
      if (fab) fab.textContent = displaySymbol(info);
      const logo = document.getElementById('symbolFabLogo');
      if (logo) {
        if (info.logoUrl) {
          logo.hidden = false;
          logo.classList.remove('missing');
          logo.src = info.logoUrl;
          logo.onerror = () => { logo.hidden = true; };
        } else {
          logo.hidden = true;
          logo.removeAttribute('src');
        }
      }
    }

    function openSymbolSearch() {
      const overlay = document.getElementById('symbolOverlay');
      overlay.hidden = false;
      const input = document.getElementById('symbolSearch');
      const q = currentSymbol?.symbol || 'BTC';
      input.value = q;
      input.focus();
      input.select();
      scheduleTvSearch(q);
    }

    function closeSymbolSearch() {
      document.getElementById('symbolOverlay').hidden = true;
      symbolHi = -1;
      clearTimeout(searchTimer);
    }

    function selectResolved(info, runLoad = true) {
      currentSymbol = info;
      applySymbolToInputs(info);
      try { localStorage.setItem(LS_SYMBOL, JSON.stringify({
        symbol: info.symbol, exchange: info.exchange, type: info.type,
        description: info.description, typespecs: [],
        logoid: info.logoid || '', logoUrl: info.logoUrl || '',
      })); } catch (_) {}
      closeSymbolSearch();
      if (runLoad) { resetWatch(); run(); }
    }

    function selectSearchIndex(idx, runLoad = true) {
      const raw = searchResults[idx];
      if (!raw) return;
      selectResolved(resolveDataSource(raw), runLoad);
    }

    function closeSymbolList() {
      symbolHi = -1;
    }

    function renderSearchResults(items, emptyMsg) {
      const list = document.getElementById('symbolList');
      searchResults = items;
      symbolHi = items.length ? 0 : -1;
      if (!items.length) {
        list.innerHTML = `<li class="empty-hint" style="pointer-events:none;border:0;display:block;padding:14px">${emptyMsg || '無符合商品'}</li>`;
        return;
      }
      list.innerHTML = items.map((s, i) =>
        `<li role="option" data-index="${i}" class="${i === 0 ? 'active' : ''}">` +
        logoImg(s.logoUrl || logoUrlFromId(s.logoid), 'sym-logo') +
        `<span class="sym">${s.symbol}</span><span class="ex">${s.exchange} · ${s.type || ''}</span>` +
        `<span class="desc">${s.description || ''}</span></li>`
      ).join('');
    }

    async function runTvSearch(query) {
      const q = query.trim();
      const list = document.getElementById('symbolList');
      if (!q) {
        renderSearchResults([], '輸入代碼或名稱（TradingView）');
        return;
      }
      const seq = ++searchSeq;
      list.innerHTML = '<li class="empty-hint" style="pointer-events:none;border:0;display:block;padding:14px">搜尋中…</li>';
      try {
        const res = await fetch(`${API_BASE}/api/tv-search?q=${encodeURIComponent(q)}`);
        if (!res.ok) throw new Error(`搜尋 HTTP ${res.status}`);
        const data = await res.json();
        if (seq !== searchSeq) return;
        renderSearchResults(data.symbols || [], '無符合商品');
      } catch (e) {
        if (seq !== searchSeq) return;
        const hint = IS_PAGES
          ? 'GitHub Pages 無搜尋代理，請本機執行 python server.py'
          : e.message;
        renderSearchResults([], `搜尋失敗：${hint}`);
      }
    }

    function scheduleTvSearch(query) {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => runTvSearch(query), 280);
    }

    function loadSavedSymbol() {
      try {
        const raw = JSON.parse(localStorage.getItem(LS_SYMBOL) || 'null');
        if (raw && raw.symbol) return resolveDataSource(raw);
      } catch (_) {}
      return resolveDataSource(DEFAULT_SYMBOL_RAW);
    }

    function populateSymbols() {
      selectResolved(loadSavedSymbol(), false);
    }

    function parseKlines(raw) {
      return raw.map(k => ({
        time: Math.floor(k[0] / 1000),
        open: +k[1], high: +k[2], low: +k[3], close: +k[4], volume: +k[5],
      }));
    }

    async function fetchBinanceSpot(symbol, totalBars, interval, onProgress) {
      const base = 'https://api.binance.com/api/v3/klines';
      const byTime = new Map();
      let endTime = null;
      while (byTime.size < totalBars) {
        const need = Math.min(1000, totalBars - byTime.size);
        let url = `${base}?symbol=${symbol}&interval=${interval}&limit=${need}`;
        if (endTime != null) url += `&endTime=${endTime}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`Binance HTTP ${res.status}`);
        const raw = await res.json();
        if (!raw.length) break;
        for (const c of parseKlines(raw)) byTime.set(c.time, c);
        endTime = raw[0][0] - 1;
        if (onProgress) onProgress(byTime.size, totalBars);
        if (raw.length < need) break;
      }
      const out = [...byTime.values()].sort((a, b) => a.time - b.time);
      return out.length > totalBars ? out.slice(-totalBars) : out;
    }

    async function fetchYahooKlines(symbol, totalBars, interval, onProgress) {
      if (IS_PAGES) {
        throw new Error('GitHub Pages 不支援 Yahoo 代理，請本機執行 python server.py，或選 Binance 加密貨幣');
      }
      const url = `${API_BASE}/api/yahoo?symbol=${encodeURIComponent(symbol)}&bars=${totalBars}&interval=${interval}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Yahoo HTTP ${res.status}（請用 python server.py 啟動）`);
      const raw = await res.json();
      if (onProgress) onProgress(raw.length, totalBars);
      return parseKlines(raw);
    }

    async function fetchKlines(symbolInfo, totalBars, timeframe, onProgress) {
      const tf = TIMEFRAMES[timeframe];
      if (symbolInfo.source === 'crypto') {
        return fetchBinanceSpot(symbolInfo.fetchSymbol, totalBars, tf.binance, onProgress);
      }
      return fetchYahooKlines(symbolInfo.fetchSymbol, totalBars, tf.yahoo, onProgress);
    }

    function findPivots(candles, len, highsOnly, lowsOnly) {
      const highs = [], lows = [];
      for (let i = len; i < candles.length - len; i++) {
        let isHigh = true, isLow = true;
        for (let j = 1; j <= len; j++) {
          if (candles[i].high <= candles[i - j].high || candles[i].high <= candles[i + j].high) isHigh = false;
          if (candles[i].low >= candles[i - j].low || candles[i].low >= candles[i + j].low) isLow = false;
        }
        if (isHigh && !lowsOnly) highs.push({ index: i, time: candles[i].time, price: candles[i].high });
        if (isLow && !highsOnly) lows.push({ index: i, time: candles[i].time, price: candles[i].low });
      }
      return { highs, lows };
    }

    function linePrice(p1, slope, idx) {
      return p1.price + slope * (idx - p1.index);
    }

    function pivotOnLine(p, lp) {
      const tol = Math.max(Math.abs(lp) * PIVOT_LINE_TOL_PCT, 1e-9);
      return Math.abs(p.price - lp) <= tol;
    }

    function wickNearLine(candles, i, lp, resistance) {
      const tol = Math.max(Math.abs(lp) * NEAR_LINE_TOL_PCT, 1e-9);
      const wick = resistance ? candles[i].high : candles[i].low;
      return Math.abs(wick - lp) <= tol;
    }

    function isLocalExtreme(candles, i, resistance) {
      const wing = LOCAL_EXTREME_WING;
      if (resistance) {
        const h = candles[i].high;
        for (let j = 1; j <= wing; j++) {
          if (i - j < 0 || i + j >= candles.length) return false;
          if (candles[i - j].high > h || candles[i + j].high > h) return false;
        }
        return true;
      }
      const lo = candles[i].low;
      for (let j = 1; j <= wing; j++) {
        if (i - j < 0 || i + j >= candles.length) return false;
        if (candles[i - j].low < lo || candles[i + j].low < lo) return false;
      }
      return true;
    }

    function countLineTouchPoints(candles, p1, slope, startI, endI, resistance, pts, ptLo, ptHi) {
      const onLinePivotIdx = new Set();
      if (pts != null && ptHi >= ptLo) {
        for (let k = ptLo; k <= ptHi; k++) {
          const idx = pts[k].index;
          const lp = linePrice(p1, slope, idx);
          if (pivotOnLine(pts[k], lp)) onLinePivotIdx.add(idx);
        }
      }
      let count = 0;
      let lastTouchI = -1e9;
      for (let i = startI; i <= endI; i++) {
        const lp = linePrice(p1, slope, i);
        let qualifies;
        if (onLinePivotIdx.has(i)) {
          qualifies = true;
        } else if (isLocalExtreme(candles, i, resistance) && wickNearLine(candles, i, lp, resistance)) {
          qualifies = true;
        } else {
          qualifies = false;
        }
        if (!qualifies) continue;
        if (i - lastTouchI < MIN_TOUCH_BAR_GAP) continue;
        count++;
        lastTouchI = i;
      }
      return count;
    }

    function countLinePivots(candles, pts, a, c, p1, slope, resistance) {
      return countLineTouchPoints(
        candles, p1, slope, pts[a].index, pts[c].index, resistance, pts, a, c
      );
    }

    function bodyCrosses(candles, i, lp, resistance) {
      const c = candles[i];
      if (resistance) return Math.max(c.open, c.close) > lp;
      return Math.min(c.open, c.close) < lp;
    }

    function isSharpPierceBar(candles, i, resistance, sharpOpts) {
      if (resistance) return sharpUp(candles, i, sharpOpts.dropPct, sharpOpts.minStreak, sharpOpts.useStructure);
      return sharpDown(candles, i, sharpOpts.dropPct, sharpOpts.minStreak, sharpOpts.useStructure);
    }

    /** 实体穿透校验：急涨/跌可贯穿；贯穿后 wrong-side 实体不得超过 SHARP_PIERCE_GRACE_BARS 根 */
    function validateLineBodySegment(candles, p1, slope, startI, endI, resistance, sharpOpts) {
      if (startI > endI) return true;
      let inGrace = false;
      let afterPierce = 0;
      for (let i = startI; i <= endI; i++) {
        const lp = linePrice(p1, slope, i);
        if (!bodyCrosses(candles, i, lp, resistance)) {
          inGrace = false;
          afterPierce = 0;
          continue;
        }
        if (isSharpPierceBar(candles, i, resistance, sharpOpts)) {
          inGrace = true;
          afterPierce = 0;
          continue;
        }
        if (inGrace) {
          afterPierce++;
          if (afterPierce > (sharpOpts.graceBars ?? SHARP_PIERCE_GRACE_BARS)) return false;
          continue;
        }
        return false;
      }
      return true;
    }

    function findLineBreakIndex(candles, line, sharpOpts) {
      const { p1, slope, type } = line;
      const resistance = type === 'resistance';
      let inGrace = false;
      let afterPierce = 0;
      for (let i = p1.index + 1; i < candles.length; i++) {
        const lp = linePrice(p1, slope, i);
        if (!bodyCrosses(candles, i, lp, resistance)) {
          inGrace = false;
          afterPierce = 0;
          continue;
        }
        if (isSharpPierceBar(candles, i, resistance, sharpOpts)) {
          inGrace = true;
          afterPierce = 0;
          continue;
        }
        if (inGrace) {
          afterPierce++;
          if (afterPierce > (sharpOpts.graceBars ?? SHARP_PIERCE_GRACE_BARS)) return i;
          continue;
        }
        return i;
      }
      return null;
    }

    /** 兩 pivot 之間不可被實體穿透（TradingView Simple Auto Trend Lines + 急涨跌贯穿 grace） */
    function validBetweenPivots(candles, p1, p2, resistance, sharpOpts) {
      if (p2.index <= p1.index) return false;
      const slope = (p2.price - p1.price) / (p2.index - p1.index);
      return validateLineBodySegment(candles, p1, slope, p1.index + 1, p2.index - 1, resistance, sharpOpts);
    }

    /** 第二 pivot 到現價之間也不可被穿透 */
    function validToCurrent(candles, p1, p2, resistance, sharpOpts) {
      const slope = (p2.price - p1.price) / (p2.index - p1.index);
      return validateLineBodySegment(candles, p1, slope, p2.index + 1, candles.length - 1, resistance, sharpOpts);
    }

    function buildAutoTrendLines(candles, opts) {
      const startIdx = Math.max(0, candles.length - opts.maxLookback);
      const slice = candles.slice(startIdx);
      const offset = startIdx;

      const pivHigh = findPivots(slice, opts.pivotHigh, true, false).highs
        .map(p => ({ ...p, index: p.index + offset }));
      const pivLow = findPivots(slice, opts.pivotLow, false, true).lows
        .map(p => ({ ...p, index: p.index + offset }));

      const sharpOpts = {
        dropPct: opts.dropPct,
        minStreak: opts.minStreak,
        useStructure: opts.useStructure,
        graceBars: opts.graceBars ?? SHARP_PIERCE_GRACE_BARS,
      };

      function collect(pts, resistance) {
        const candidates = [];
        for (let a = 0; a < pts.length; a++) {
          let countFromPivot = 0;
          for (let c = a + 1; c < pts.length; c++) {
            if (countFromPivot >= MAX_LINES_PER_PIVOT) break;
            const p1 = pts[a], p3 = pts[c];
            if (resistance && p3.price >= p1.price) continue;
            if (!resistance && p3.price <= p1.price) continue;
            const slope = (p3.price - p1.price) / (p3.index - p1.index);
            const pivotCount = countLinePivots(candles, pts, a, c, p1, slope, resistance);
            if (pivotCount < MIN_LINE_PIVOTS) continue;
            if (!validBetweenPivots(candles, p1, p3, resistance, sharpOpts)) continue;
            if (!validToCurrent(candles, p1, p3, resistance, sharpOpts)) continue;
            const endIdx = candles.length - 1;
            candidates.push({
              type: resistance ? 'resistance' : 'support',
              p1, p2: p3, slope,
              span: p3.index - p1.index,
              pivotCount,
              endTime: candles[endIdx].time,
              endPrice: linePrice(p1, slope, endIdx),
            });
            countFromPivot++;
          }
        }
        candidates.sort((a, b) => b.pivotCount - a.pivotCount || b.span - a.span || a.p1.index - b.p1.index);
        const picked = [];
        const usedPivotA = new Set();
        for (const c of candidates) {
          if (picked.length >= (resistance ? opts.maxResistance : opts.maxSupport)) break;
          if (usedPivotA.has(c.p1.index)) continue;
          picked.push(c);
          usedPivotA.add(c.p1.index);
        }
        return picked;
      }

      return [...collect(pivHigh, true), ...collect(pivLow, false)];
    }

    function checkLineInvalidation(candles, line, sharpOpts) {
      return findLineBreakIndex(candles, line, sharpOpts) != null;
    }

    function lineEndAtBreak(candles, line, sharpOpts) {
      const breakI = findLineBreakIndex(candles, line, sharpOpts);
      const endI = breakI != null ? breakI : candles.length - 1;
      const safeEnd = Math.max(endI, line.p2.index);
      return {
        endTime: candles[safeEnd].time,
        endPrice: linePrice(line.p1, line.slope, safeEnd),
        invalid: breakI != null,
      };
    }

    function priceAtLine(line, index) {
      return linePrice(line.p1, line.slope, index);
    }

    function sharpDown(candles, idx, dropPctMin, minStreak, useStructure) {
      if (idx < LOOKBACK + minStreak) return false;
      const base = candles[idx - LOOKBACK].close;
      if (!base) return false;
      const dropPct = (base - candles[idx].close) / base * 100;
      if (dropPct < dropPctMin) return false;
      if (!streak(candles, idx, true, minStreak)) return false;
      if (useStructure) {
        let priorMax = -Infinity;
        for (let k = 1; k <= LOOKBACK; k++) priorMax = Math.max(priorMax, candles[idx - k].high);
        if (candles[idx].high >= priorMax) return false;
      }
      return true;
    }

    function sharpUp(candles, idx, dropPctMin, minStreak, useStructure) {
      if (idx < LOOKBACK + minStreak) return false;
      const base = candles[idx - LOOKBACK].close;
      if (!base) return false;
      const risePct = (candles[idx].close - base) / base * 100;
      if (risePct < dropPctMin) return false;
      if (!streak(candles, idx, false, minStreak)) return false;
      if (useStructure) {
        let priorMin = Infinity;
        for (let k = 1; k <= LOOKBACK; k++) priorMin = Math.min(priorMin, candles[idx - k].low);
        if (candles[idx].low <= priorMin) return false;
      }
      return true;
    }

    function detectSignals(candles, dropPctMin, minStreak, volMult, useStructure) {
      const signals = [];
      const start = LOOKBACK + minStreak + 1;
      for (let i = start; i < candles.length; i++) {
        const volMa = sma(candles.map(x => x.volume), i, VOL_LEN);
        const highVol = volMa == null || candles[i].volume >= volMa * volMult;
        if (!highVol) continue;
        const prev = i - 1;
        if (bullBar(candles, i) && bearBar(candles, prev) && sharpDown(candles, prev, dropPctMin, minStreak, useStructure)) {
          signals.push({ type: 'AR', index: i, time: candles[i].time, level: candles[i].high, close: candles[i].close, volume: candles[i].volume });
        }
        if (bearBar(candles, i) && bullBar(candles, prev) && sharpUp(candles, prev, dropPctMin, minStreak, useStructure)) {
          signals.push({ type: 'DR', index: i, time: candles[i].time, level: candles[i].low, close: candles[i].close, volume: candles[i].volume });
        }
      }
      return signals;
    }

    function resolveWickRay(candles, sigIdx, level, side) {
      const startTime = candles[sigIdx].time;
      const isUpper = side === 'upper';
      for (let j = sigIdx + 1; j < candles.length; j++) {
        const bar = candles[j];
        const touched = isUpper ? bar.high >= level : bar.low <= level;
        if (touched) {
          return {
            side, level, startTime, endTime: bar.time, touchIndex: j,
            active: false, barsAfter: j - sigIdx,
          };
        }
      }
      const last = candles[candles.length - 1];
      return {
        side, level, startTime, endTime: last.time, touchIndex: null,
        active: true, barsAfter: null,
      };
    }

    function resolveSignalRays(candles, item) {
      const bar = candles[item.index];
      return {
        upper: resolveWickRay(candles, item.index, bar.high, 'upper'),
        lower: resolveWickRay(candles, item.index, bar.low, 'lower'),
      };
    }

    function primaryRay(rays, type) {
      return type === 'AR' ? rays.upper : rays.lower;
    }

    function analyzeSignalContext(sig, candles, trendLines) {
      const resist = trendLines.filter(l => l.type === 'resistance' && !l.invalidated);
      const support = trendLines.filter(l => l.type === 'support' && !l.invalidated);

      if (sig.type === 'AR') {
        const nearest = resist
          .map(l => ({ l, lp: priceAtLine(l, sig.index) }))
          .filter(x => x.lp >= sig.close)
          .sort((a, b) => a.lp - b.lp)[0];
        if (!nearest) return { text: '無有效阻力線參考', cls: 'weak' };
        if (sig.close > nearest.lp) return { text: '收盤站回阻力趨勢線 → 結構轉強', cls: 'strong' };
        return { text: '仍在下降趨勢線下方 → 短線反彈', cls: 'weak' };
      }

      const nearest = support
        .map(l => ({ l, lp: priceAtLine(l, sig.index) }))
        .filter(x => x.lp <= sig.close)
        .sort((a, b) => b.lp - a.lp)[0];
      if (!nearest) return { text: '無有效支撐線參考', cls: 'weak' };
      if (sig.close < nearest.lp) return { text: '收盤跌破支撐趨勢線 → 結構轉弱', cls: 'strong' };
      return { text: '仍在上升趨勢線上方 → 短線回檔', cls: 'weak' };
    }

    function rayWatchKey(ctx, sig) {
      return `${ctx.market}:${ctx.symbol}:${ctx.timeframe}:ray:${sig.type}:${sig.time}:${sig.level}`;
    }

    function trendWatchKey(ctx, line) {
      return `${ctx.market}:${ctx.symbol}:${ctx.timeframe}:tl:${line.type}:${line.p1.time}:${line.p1.price}:${line.p2.time}:${line.p2.price}`;
    }

    function resetWatch() {
      watchBaseline = false;
      untouchedRayKeys = new Set();
      activeExtRayKeys = new Set();
      untouchedTrendKeys = new Set();
      notExceedingTrendKeys = new Set();
    }

    function recordTouch(item) {
      if (breakHistory.some(b => b.key === item.key)) return;
      breakHistory.unshift({ ...item, isNew: true });
      breakHistory = breakHistory.slice(0, 30);
      persistHistoryEntry(item);
      renderBreakLog();
      renderHistoryLog();
      switchRailTab('touches');
      const status = document.getElementById('status');
      const price = item.level.toLocaleString(undefined, { maximumFractionDigits: 4 });
      status.textContent = `⚡ ${item.label} · ${item.displaySymbol || item.symbol} ${item.tfLabel} · ${price} · ${fmtTime(item.time)}`;
    }

    function renderBreakLog() {
      const ul = document.getElementById('breakLog');
      ul.innerHTML = '';
      const fabTouch = document.getElementById('fabTouchCount');
      if (fabTouch) fabTouch.textContent = String(breakHistory.length);
      if (!breakHistory.length) {
        ul.innerHTML = '<li class="empty-hint">尚無觸碰紀錄</li>';
        return;
      }
      breakHistory.slice(0, 12).forEach(item => {
        const li = document.createElement('li');
        li.className = `break-item ${item.cssType}${item.isNew ? ' new' : ''}`;
        li.textContent = `${item.label} · ${item.displaySymbol || item.symbol} ${item.tfLabel} · ${item.level.toLocaleString(undefined, { maximumFractionDigits: 2 })} · ${fmtTime(item.time)}`;
        ul.appendChild(li);
        if (item.isNew) setTimeout(() => { item.isNew = false; }, 1500);
      });
    }

    /** 趨勢線首次被 K 線影線觸碰（失效 bar 之前） */
    function findTrendTouch(candles, line, sharpOpts) {
      const start = Math.max(line.p2.index, line.p1.index) + 1;
      const breakI = findLineBreakIndex(candles, line, sharpOpts);
      const end = breakI != null ? breakI - 1 : candles.length - 1;
      for (let i = start; i <= end; i++) {
        const lp = linePrice(line.p1, line.slope, i);
        const c = candles[i];
        const touched = line.type === 'resistance' ? c.high >= lp : c.low <= lp;
        if (touched) {
          return { time: c.time, price: lp, index: i };
        }
      }
      return null;
    }

    /** 最新 N 根 K 實體皆超出趨勢線 */
    function findTrendExceed(candles, line, n = TREND_EXCEED_BARS) {
      if (candles.length < n) return null;
      const lineStart = Math.max(line.p2.index, line.p1.index);
      const firstI = candles.length - n;
      if (firstI <= lineStart) return null;
      const resistance = line.type === 'resistance';
      for (let i = firstI; i < candles.length; i++) {
        const lp = linePrice(line.p1, line.slope, i);
        if (!bodyCrosses(candles, i, lp, resistance)) return null;
      }
      const lastI = candles.length - 1;
      const lp = linePrice(line.p1, line.slope, lastI);
      const c = candles[lastI];
      return { time: c.time, price: lp, index: lastI };
    }

    function checkTouchNotifications(signals, trendLines, candles, ctx, sharpOpts) {
      const nextUntouchedRays = new Set();
      const nextUntouchedTrends = new Set();
      const nextNotExceeding = new Set();
      const touches = [];

      for (const sig of signals) {
        if (!sig.rays) continue;
        const key = rayWatchKey(ctx, sig);
        const primary = primaryRay(sig.rays, sig.type);

        if (primary.active) {
          nextUntouchedRays.add(key);
        } else if (watchBaseline && untouchedRayKeys.has(key)) {
          if (primary.barsAfter != null && primary.barsAfter > TOUCH_WINDOW_BARS) {
            touches.push({
              key: `${key}:${primary.side}:${primary.endTime}`,
              cssType: sig.type.toLowerCase(),
              label: `${sig.type} 觸碰`,
              symbol: ctx.fetchSymbol,
              displaySymbol: ctx.symbol,
              group: ctx.groupId,
              name: ctx.name,
              timeframe: ctx.timeframe,
              tfLabel: ctx.tfLabel,
              level: primary.level,
              time: primary.endTime,
            });
          }
        }
      }

      for (const line of trendLines) {
        if (line.invalidated) continue;
        const key = trendWatchKey(ctx, line);
        const touch = findTrendTouch(candles, line, sharpOpts);
        if (!touch) {
          nextUntouchedTrends.add(key);
        } else if (watchBaseline && untouchedTrendKeys.has(key)) {
          touches.push({
            key: `${key}:touch:${touch.time}`,
            cssType: line.type,
            label: line.type === 'resistance' ? '阻力趨勢線觸碰' : '支撐趨勢線觸碰',
            symbol: ctx.fetchSymbol,
            displaySymbol: ctx.symbol,
            group: ctx.groupId,
            name: ctx.name,
            timeframe: ctx.timeframe,
            tfLabel: ctx.tfLabel,
            level: touch.price,
            time: touch.time,
          });
        }
      }

      for (const line of trendLines) {
        const key = trendWatchKey(ctx, line);
        const exc = findTrendExceed(candles, line);
        if (!exc) {
          nextNotExceeding.add(key);
        } else if (watchBaseline && notExceedingTrendKeys.has(key)) {
          touches.push({
            key: `${key}:exceed:${exc.time}`,
            cssType: line.type,
            label: line.type === 'resistance' ? '阻力趨勢線超出' : '支撐趨勢線超出',
            symbol: ctx.fetchSymbol,
            displaySymbol: ctx.symbol,
            group: ctx.groupId,
            name: ctx.name,
            timeframe: ctx.timeframe,
            tfLabel: ctx.tfLabel,
            level: exc.price,
            time: exc.time,
          });
        }
      }

      if (!watchBaseline) {
        for (const sig of signals) {
          if (!sig.rays) continue;
          const key = rayWatchKey(ctx, sig);
          if (primaryRay(sig.rays, sig.type).active) untouchedRayKeys.add(key);
        }
        for (const line of trendLines) {
          if (!line.invalidated && !findTrendTouch(candles, line, sharpOpts)) {
            untouchedTrendKeys.add(trendWatchKey(ctx, line));
          }
          if (!findTrendExceed(candles, line)) {
            notExceedingTrendKeys.add(trendWatchKey(ctx, line));
          }
        }
        watchBaseline = true;
        return 0;
      }

      untouchedRayKeys = nextUntouchedRays;
      activeExtRayKeys = new Set();
      untouchedTrendKeys = nextUntouchedTrends;
      notExceedingTrendKeys = nextNotExceeding;
      touches.forEach(recordTouch);
      return touches.length;
    }

    function schedulePoll() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = null;
      const sec = +document.getElementById('pollInterval').value;
      if (sec > 0) pollTimer = setInterval(() => run({ silent: true }), sec * 1000);
    }

    function fmtTime(ts) {
      if (ts == null) return '—';
      const n = Number(ts);
      const ms = n > 1e12 ? n : n * 1000;
      return new Date(ms).toLocaleString(undefined, {
        month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit',
      });
    }

    function hitKindLabel(kind, type) {
      if (kind === 'ar_dr_touch') return `${type || 'AR/DR'} 晚觸碰`;
      if (kind === 'trend_exceed') return type === 'resistance' ? '阻力超出' : '支撐超出';
      if (kind === 'trend_touch') return type === 'resistance' ? '阻力觸碰' : '支撐觸碰';
      return kind || '事件';
    }

    function hitCssType(kind, type) {
      if (kind === 'ar_dr_touch') return (type || 'AR').toLowerCase();
      if (type === 'resistance' || type === 'support') return type;
      return 'ar';
    }

    function symbolInfoFromHit(hit) {
      const group = String(hit.group || '');
      const symbol = String(hit.symbol || '');
      const name = String(hit.name || symbol);
      if (!symbol) return null;
      if (group === 'crypto') {
        return resolveDataSource({
          symbol, exchange: 'Binance', type: 'spot', description: name,
          typespecs: ['crypto', 'spot'],
        });
      }
      if (group === 'futures') {
        return resolveDataSource({ symbol, exchange: 'CME', type: 'futures', description: name });
      }
      if (group === 'fx') {
        const pair = symbol.replace('=X', '');
        return {
          tvKey: `FX:${pair}`, exchange: 'FX', symbol: pair, type: 'forex',
          description: name, logoid: '', logoUrl: '',
          group: 'FX', groupId: 'fx',
          source: 'yahoo', value: symbol, fetchSymbol: symbol,
        };
      }
      const exchange = group === 'dji30' ? 'NYSE' : 'NASDAQ';
      return resolveDataSource({ symbol, exchange, type: 'stock', description: name });
    }

    function loadLocalHistory() {
      try {
        const raw = JSON.parse(localStorage.getItem(LS_HISTORY) || '[]');
        return Array.isArray(raw) ? raw : [];
      } catch (_) {
        return [];
      }
    }

    function saveLocalHistory(items) {
      try { localStorage.setItem(LS_HISTORY, JSON.stringify(items.slice(0, MAX_LOCAL_HISTORY))); } catch (_) {}
    }

    function persistHistoryEntry(item) {
      const hist = loadLocalHistory();
      if (hist.some(h => h.key === item.key)) return;
      hist.unshift({ ...item, recordedAt: Date.now(), source: 'live' });
      saveLocalHistory(hist);
    }

    function mergeHistoryEntries() {
      const seen = new Set();
      const out = [];
      const push = (entry) => {
        const key = entry.key || `${entry.source}:${entry.symbol}:${entry.time}:${entry.label}`;
        if (seen.has(key)) return;
        seen.add(key);
        out.push(entry);
      };
      (scanReport?.hits || []).forEach(h => {
        push({
          key: `scan:${h.group}:${h.symbol}:${h.timeframe}:${h.kind}:${h.time}`,
          source: 'scan',
          kind: h.kind,
          cssType: hitCssType(h.kind, h.type),
          label: hitKindLabel(h.kind, h.type),
          symbol: h.symbol,
          name: h.name,
          group: h.group,
          tfLabel: (h.timeframe || '1d').toUpperCase(),
          timeframe: h.timeframe || '1d',
          level: Number(h.level),
          time: h.time,
          hit: h,
        });
      });
      loadLocalHistory().forEach(push);
      out.sort((a, b) => Number(b.time || 0) - Number(a.time || 0));
      return out.slice(0, MAX_HISTORY_DISPLAY);
    }

    async function fetchScanReport(force = false) {
      const token = ++historyFetchToken;
      if (!force && scanReport) return scanReport;
      const meta = document.getElementById('historyMeta');
      try {
        const res = await fetch(REPORT_JSON, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (token !== historyFetchToken) return scanReport;
        scanReport = data;
        if (meta) {
          meta.innerHTML = scanReport.generated_at
            ? `掃描報告 <strong>${scanReport.generated_at}</strong> · ${scanReport.counts?.hits ?? 0} hits`
            : '掃描報告已載入';
        }
        return scanReport;
      } catch (e) {
        if (token !== historyFetchToken) return scanReport;
        if (meta) meta.textContent = IS_PAGES
          ? `無法載入報告：${e.message}`
          : `無法載入報告（請確認 signals/latest.json 存在）`;
        return null;
      }
    }

    function renderHistoryLog() {
      const ul = document.getElementById('historyLog');
      if (!ul) return;
      const items = mergeHistoryEntries();
      ul.innerHTML = '';
      if (!items.length) {
        ul.innerHTML = '<li class="empty-hint">尚無歷史紀錄</li>';
        return;
      }
      items.forEach((item, idx) => {
        const li = document.createElement('li');
        li.className = `history-item ${item.cssType || ''}`;
        li.dataset.index = String(idx);
        const lvl = Number.isFinite(item.level)
          ? item.level.toLocaleString(undefined, { maximumFractionDigits: 4 })
          : '—';
        li.innerHTML =
          `<div class="hi-head"><span class="hi-tag">${item.label}</span>` +
          `<span class="hi-src">${item.source === 'scan' ? '掃描' : '即時'}</span></div>` +
          `<div class="hi-body">${item.symbol} · ${item.tfLabel} · ${lvl}</div>` +
          `<div class="hi-time">${fmtTime(item.time)}</div>`;
        ul.appendChild(li);
      });
    }

    async function refreshHistoryPanel(force = false) {
      await fetchScanReport(force);
      renderHistoryLog();
    }

    function openHistoryEntry(item) {
      if (item.hit) {
        const info = symbolInfoFromHit(item.hit);
        if (!info) return;
        const tf = item.hit.timeframe || '1d';
        if (TIMEFRAMES[tf]) document.getElementById('timeframe').value = tf;
        selectResolved(info, true);
        return;
      }
      const info = symbolInfoFromHit({
        group: item.group,
        symbol: item.symbol,
        name: item.name || item.symbol,
      });
      if (!info) return;
      const tf = item.timeframe || '1d';
      if (TIMEFRAMES[tf]) document.getElementById('timeframe').value = tf;
      selectResolved(info, true);
    }

    function renderSignals(signals, candles, trendLines) {
      const ul = document.getElementById('signals');
      ul.innerHTML = '';
      const raysOf = s => s.rays || resolveSignalRays(candles, s);

      const arN = signals.filter(s => s.type === 'AR' && primaryRay(raysOf(s), s.type).active).length;
      const drN = signals.filter(s => s.type === 'DR' && primaryRay(raysOf(s), s.type).active).length;
      document.getElementById('arCount').textContent = arN;
      document.getElementById('drCount').textContent = drN;
      const fabSig = document.getElementById('fabSignalCount');
      if (fabSig) fabSig.textContent = String(arN + drN);

      if (!signals.length) {
        ul.innerHTML = '<li class="empty-hint">尚無 AR/DR 信號</li>';
        return;
      }
      [...signals].reverse().slice(0, 15).forEach(sig => {
        const rays = raysOf(sig);
        const primary = primaryRay(rays, sig.type);
        const ctx = analyzeSignalContext(sig, candles, trendLines);
        const li = document.createElement('li');
        li.className = `signal-item ${sig.type.toLowerCase()}${primary.active ? '' : ' touched'}`;
        li.innerHTML = `
          <span class="tag ${sig.type.toLowerCase()}">${sig.type}</span>
          ${primary.active ? '<span style="color:var(--profit)">有效</span>' : '<span style="color:var(--muted)">已碰</span>'}
          · ${fmtTime(sig.time)}<br>
          上 ${rays.upper.level.toLocaleString(undefined, { maximumFractionDigits: 2 })} ${rays.upper.active ? '→' : '停'}
          · 下 ${rays.lower.level.toLocaleString(undefined, { maximumFractionDigits: 2 })} ${rays.lower.active ? '→' : '停'}<br>
          · 收 ${sig.close.toLocaleString(undefined, { maximumFractionDigits: 2 })}<br>
          <span class="ctx ${ctx.cls}">${ctx.text}</span>
        `;
        ul.appendChild(li);
      });
    }

    function initChart() {
      const chartEl = document.getElementById('chart');
      const wrap = document.querySelector('.chart-pane');
      chartEl.innerHTML = '';
      chart = LightweightCharts.createChart(chartEl, {
        width: wrap.clientWidth || undefined,
        height: wrap.clientHeight || undefined,
        layout: { background: { color: '#000000' }, textColor: '#7a93a8' },
        grid: { vertLines: { color: 'rgba(0,240,200,0.04)' }, horzLines: { color: 'rgba(0,240,200,0.04)' } },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        rightPriceScale: { borderColor: '#2a364d' },
        timeScale: { borderColor: '#2a364d', timeVisible: true },
      });
      candleSeries = chart.addCandlestickSeries({
        upColor: '#00e896', downColor: '#ff4d6d',
        borderUpColor: '#00e896', borderDownColor: '#ff4d6d',
        wickUpColor: '#5dffb1', wickDownColor: '#ff7a90',
      });
      volSeries = chart.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: 'vol' });
      chart.priceScale('vol').applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
    }

    function drawSegment(p1Time, p1Price, endTime, endPrice, color, width, style) {
      const s = chart.addLineSeries({
        color, lineWidth: width,
        lineStyle: style ?? LightweightCharts.LineStyle.Solid,
        priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
      });
      s.setData([{ time: p1Time, value: p1Price }, { time: endTime, value: endPrice }]);
      overlayLines.push(s);
    }

    const RAY_ALPHA = { active: 1, touched: 0.3 };
    const RAY_RGB = { AR: '0,232,150', DR: '255,77,109' };

    function rayColor(type, active) {
      const a = active ? RAY_ALPHA.active : RAY_ALPHA.touched;
      return `rgba(${RAY_RGB[type]},${a})`;
    }

    function signalMarkerColor(type, active) {
      if (type === 'AR') return active ? '#00e896' : 'rgba(0,232,150,0.35)';
      return active ? '#ff4d6d' : 'rgba(255,77,109,0.35)';
    }

    function drawSignalRays(sig, rays, lastTime) {
      for (const side of ['upper', 'lower']) {
        const r = rays[side];
        const t1 = r.active ? lastTime : r.endTime;
        if (t1 <= r.startTime) continue;
        drawRaySegment(r.level, r.startTime, t1, sig.type, r.active);
      }
    }

    function drawRaySegment(level, t0, t1, type, active) {
      const s = chart.addLineSeries({
        color: rayColor(type, active),
        lineWidth: 1,
        lineStyle: LightweightCharts.LineStyle.Dashed,
        priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
      });
      s.setData([{ time: t0, value: level }, { time: t1, value: level }]);
      overlayLines.push(s);
    }

    async function run(options = {}) {
      const { silent = false } = options;
      if (!currentSymbol) currentSymbol = loadSavedSymbol();
      const symbolInfo = currentSymbol;
      const symbol = symbolInfo.fetchSymbol;
      const market = symbolInfo.groupId;
      const timeframe = document.getElementById('timeframe').value;
      const tfLabel = TIMEFRAMES[timeframe].label;
      const historyBars = +document.getElementById('historyBars').value;
      const watchCtx = {
        market,
        symbol: symbolInfo.tvKey,
        fetchSymbol: symbolInfo.fetchSymbol,
        groupId: symbolInfo.groupId,
        name: symbolInfo.description || symbolInfo.symbol,
        timeframe,
        tfLabel,
      };
      const tlOpts = {
        pivotHigh: +document.getElementById('pivotHigh').value,
        pivotLow: +document.getElementById('pivotLow').value,
        maxLookback: +document.getElementById('maxLookback').value,
        graceBars: +document.getElementById('invalidateCross').value,
        maxResistance: +document.getElementById('maxResistance').value,
        maxSupport: +document.getElementById('maxSupport').value,
        dropPct: +document.getElementById('dropPct').value,
        minStreak: +document.getElementById('minStreak').value,
        useStructure: document.getElementById('useStructure').value === '1',
      };
      const sharpOpts = {
        dropPct: tlOpts.dropPct,
        minStreak: tlOpts.minStreak,
        useStructure: tlOpts.useStructure,
        graceBars: tlOpts.graceBars,
      };
      const dropPct = tlOpts.dropPct;
      const minStreak = tlOpts.minStreak;
      const volMult = +document.getElementById('volMult').value;
      const useStructure = tlOpts.useStructure;
      const status = document.getElementById('status');
      const display = displaySymbol(symbolInfo);

      if (!silent) status.textContent = `載入 ${display} ${tfLabel}…`;
      try {
        const candles = await fetchKlines(symbolInfo, historyBars, timeframe, (got, total) => {
          if (!silent) status.textContent = `載入 ${display} ${tfLabel}（${got}/${total}）…`;
        });

        initChart();
        overlayLines = [];
        currentCandles = candles;

        candleSeries.setData(candles);
        volSeries.setData(candles.map(c => ({
          time: c.time, value: c.volume,
          color: c.close >= c.open ? 'rgba(0,232,150,.28)' : 'rgba(255,77,109,.28)',
        })));

        const trendLines = buildAutoTrendLines(candles, tlOpts);
        trendLines.forEach(line => {
          const end = lineEndAtBreak(candles, line, sharpOpts);
          line.invalidated = end.invalid;
          line.endTime = end.endTime;
          line.endPrice = end.endPrice;
          if (!line.invalidated) {
            const last = candles[candles.length - 1];
            line.endTime = last.time;
            line.endPrice = linePrice(line.p1, line.slope, candles.length - 1);
          }
        });
        activeTrendLines = trendLines.filter(l => !l.invalidated);

        const markers = [];
        trendLines.forEach(line => {
          const alpha = line.invalidated ? 0.3 : 0.95;
          const color = line.type === 'resistance'
            ? `rgba(239,68,68,${alpha})`
            : `rgba(34,197,94,${alpha})`;
          drawSegment(line.p1.time, line.p1.price, line.endTime, line.endPrice, color, 2);
          drawSegment(line.p1.time, line.p1.price, line.p2.time, line.p2.price, color, 1, LightweightCharts.LineStyle.Dotted);
        });

        const signals = detectSignals(candles, dropPct, minStreak, volMult, useStructure);

        signals.forEach(sig => {
          sig.rays = resolveSignalRays(candles, sig);
          drawSignalRays(sig, sig.rays, candles[candles.length - 1].time);
          const primary = primaryRay(sig.rays, sig.type);
          markers.push({
            time: sig.time,
            position: sig.type === 'AR' ? 'belowBar' : 'aboveBar',
            color: signalMarkerColor(sig.type, primary.active),
            shape: 'circle',
            size: primary.active ? 2 : 1,
            text: sig.type,
          });
        });

        const newBreaks = checkTouchNotifications(signals, trendLines, candles, watchCtx, sharpOpts);

        candleSeries.setMarkers(markers.sort((a, b) => a.time - b.time));
        renderSignals(signals, candles, trendLines);
        chart.timeScale().fitContent();
        resizeChart();

        const activeRays = signals.filter(s => primaryRay(s.rays || resolveSignalRays(candles, s), s.type).active).length;
        const pollSec = +document.getElementById('pollInterval').value;
        const pollHint = pollSec > 0 ? ` · 自動刷新 ${pollSec}s` : '';
        if (newBreaks === 0) {
          status.textContent = `${display} · ${tfLabel} · ${candles.length} 根 · 趨勢線 ${activeTrendLines.length} · 有效 AR/DR ${activeRays}${pollHint}`;
        }
      } catch (e) {
        if (!silent) status.textContent = `載入失敗: ${e.message}`;
      }
    }

    document.getElementById('timeframe').addEventListener('change', () => { resetWatch(); run(); });
    document.getElementById('reload').addEventListener('click', async () => {
      const btn = document.getElementById('reload');
      btn.disabled = true; btn.textContent = '載入中…';
      resetWatch();
      try { await run(); } finally { btn.disabled = false; btn.textContent = '重新載入'; }
    });
    document.getElementById('pollInterval').addEventListener('change', schedulePoll);
    document.querySelectorAll('input,select').forEach(el => {
      if (!['symbol', 'symbolSearch', 'timeframe', 'pollInterval'].includes(el.id)) {
        el.addEventListener('change', run);
      }
    });

    const symbolSearch = document.getElementById('symbolSearch');
    const symbolList = document.getElementById('symbolList');
    const symbolOverlay = document.getElementById('symbolOverlay');

    document.getElementById('symbolFab').addEventListener('click', openSymbolSearch);
    document.getElementById('symbolSearchClose').addEventListener('click', closeSymbolSearch);
    symbolOverlay.addEventListener('mousedown', (e) => {
      if (e.target === symbolOverlay) closeSymbolSearch();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !symbolOverlay.hidden) {
        e.preventDefault();
        closeSymbolSearch();
      }
    });

    symbolSearch.addEventListener('input', () => scheduleTvSearch(symbolSearch.value));
    symbolSearch.addEventListener('keydown', (e) => {
      const opts = [...symbolList.querySelectorAll('li[data-index]')];
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (opts.length) {
          symbolHi = Math.min(symbolHi + 1, opts.length - 1);
          opts.forEach((li, i) => li.classList.toggle('active', i === symbolHi));
          opts[symbolHi].scrollIntoView({ block: 'nearest' });
        }
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (opts.length) {
          symbolHi = Math.max(symbolHi - 1, 0);
          opts.forEach((li, i) => li.classList.toggle('active', i === symbolHi));
          opts[symbolHi].scrollIntoView({ block: 'nearest' });
        }
      } else if (e.key === 'Enter') {
        e.preventDefault();
        const pick = opts[symbolHi] || opts[0];
        if (pick) selectSearchIndex(+pick.dataset.index);
      }
    });
    symbolList.addEventListener('mousedown', (e) => {
      const li = e.target.closest('li[data-index]');
      if (!li) return;
      e.preventDefault();
      selectSearchIndex(+li.dataset.index);
    });


    function switchRailTab(tab) {
      const statsEl = document.getElementById('railStats');
      if (statsEl) statsEl.hidden = tab !== 'signals';

      document.querySelectorAll('.rail-nav button').forEach(b => {
        const on = b.dataset.panel === tab;
        b.classList.toggle('active', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      document.querySelectorAll('.rail-panel').forEach(p => {
        const on = p.id === `panel-${tab}`;
        p.classList.toggle('active', on);
        p.hidden = !on;
      });
      if (tab === 'history') refreshHistoryPanel(true);
    }

    document.querySelectorAll('.rail-nav button').forEach(btn => {
      btn.addEventListener('click', () => switchRailTab(btn.dataset.panel));
    });

    function clampRailWidth(w) {
      const maxByViewport = Math.max(RAIL_W_MIN, Math.floor(window.innerWidth * 0.55));
      return Math.min(RAIL_W_MAX, maxByViewport, Math.max(RAIL_W_MIN, Math.round(w)));
    }

    function applyRailWidth(w, { persist = false } = {}) {
      const width = clampRailWidth(w);
      document.documentElement.style.setProperty('--rail-w', `${width}px`);
      const handle = document.getElementById('railResizer');
      if (handle) {
        handle.setAttribute('aria-valuenow', String(width));
        handle.setAttribute('aria-valuemin', String(RAIL_W_MIN));
        handle.setAttribute('aria-valuemax', String(RAIL_W_MAX));
      }
      if (persist) {
        try { localStorage.setItem(LS_RAIL_W, String(width)); } catch (_) {}
      }
      if (typeof resizeChart === 'function') resizeChart();
      return width;
    }

    function loadRailWidth() {
      try {
        const saved = Number(localStorage.getItem(LS_RAIL_W));
        if (Number.isFinite(saved) && saved > 0) return applyRailWidth(saved);
      } catch (_) {}
      return applyRailWidth(RAIL_W_DEFAULT);
    }

    function initRailResize() {
      const handle = document.getElementById('railResizer');
      if (!handle) return;
      let dragging = false;

      const onMove = (clientX) => {
        if (!dragging) return;
        applyRailWidth(window.innerWidth - clientX);
      };

      handle.addEventListener('pointerdown', (e) => {
        if (e.button != null && e.button !== 0) return;
        dragging = true;
        document.body.classList.add('rail-resizing');
        handle.setPointerCapture?.(e.pointerId);
        e.preventDefault();
      });

      handle.addEventListener('pointermove', (e) => onMove(e.clientX));

      const endDrag = (e) => {
        if (!dragging) return;
        dragging = false;
        document.body.classList.remove('rail-resizing');
        try { handle.releasePointerCapture?.(e.pointerId); } catch (_) {}
        const current = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--rail-w')) || RAIL_W_DEFAULT;
        applyRailWidth(current, { persist: true });
      };

      handle.addEventListener('pointerup', endDrag);
      handle.addEventListener('pointercancel', endDrag);

      handle.addEventListener('dblclick', () => {
        applyRailWidth(RAIL_W_DEFAULT, { persist: true });
      });

      handle.addEventListener('keydown', (e) => {
        const step = e.shiftKey ? 40 : 16;
        const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--rail-w')) || RAIL_W_DEFAULT;
        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          applyRailWidth(cur + step, { persist: true });
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          applyRailWidth(cur - step, { persist: true });
        } else if (e.key === 'Home') {
          e.preventDefault();
          applyRailWidth(RAIL_W_DEFAULT, { persist: true });
        }
      });
      handle.tabIndex = 0;
    }

    document.getElementById('historyLog')?.addEventListener('click', (e) => {
      const li = e.target.closest('.history-item[data-index]');
      if (!li) return;
      const items = mergeHistoryEntries();
      const item = items[+li.dataset.index];
      if (item) openHistoryEntry(item);
    });

    populateSymbols();
    initChart();
    loadRailWidth();
    initRailResize();
    renderBreakLog();
    refreshHistoryPanel();
    if (location.hash === '#history') switchRailTab('history');
    else switchRailTab('signals');
    run();
    schedulePoll();

    function resizeChart() {
      if (!chart) return;
      const wrap = document.querySelector('.chart-pane');
      if (!wrap.clientWidth || !wrap.clientHeight) return;
      chart.applyOptions({ width: wrap.clientWidth, height: wrap.clientHeight });
    }

    window.addEventListener('resize', () => {
      const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--rail-w')) || RAIL_W_DEFAULT;
      applyRailWidth(cur);
      resizeChart();
    });
    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(() => resizeChart()).observe(document.querySelector('.chart-pane'));
    }
  </script>
</body>
